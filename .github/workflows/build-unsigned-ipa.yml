name: Build Unsigned IPA

# Fork-only workflow: builds the iOS app unsigned and uploads the IPA.
# Manually dispatched after code changes are pushed (no push trigger, so
# several file uploads never race each other).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: Kumone
  VERSION: "0.3.28"

jobs:
  ios:
    # Same runner as the upstream release job: iPhone Duo inner display needs
    # the iOS 27.1 SDK; GitHub's xcode-27 image defaults to Xcode 27.1.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: build number = commit count

      - name: Derive version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build unsigned iOS IPA
        run: |
          mkdir -p dist
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-iOS-$VERSION.ipa" Payload)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Kumone-unsigned-ipa
          path: dist/${{ env.APP_NAME }}-iOS-${{ env.VERSION }}.ipa
          if-no-files-found: error
